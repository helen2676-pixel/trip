<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>규슈 가족여행 플래너</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap"/>
<style>
:root {
  --bg: #f5f2ec; --card: #fff; --primary: #2d6a4f; --primary-light: #52b788;
  --accent: #d4a017; --text: #1a1a2e; --muted: #6b7280; --border: #e5e0d8;
  --shadow: 0 2px 12px rgba(0,0,0,0.08); --radius: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* STICKY TOP */
.sticky-top { position: sticky; top: 0; z-index: 200; box-shadow: 0 2px 16px rgba(0,0,0,0.18); }

/* HEADER */
header { background: var(--primary); color: white; padding: 14px 16px 10px; }
header h1 { font-size: 1.25rem; font-weight: 700; }
header p { font-size: 0.72rem; opacity: 0.8; margin-top: 2px; }
.header-meta { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
.header-badge { background: rgba(255,255,255,0.18); border-radius: 20px; padding: 3px 10px; font-size: 0.7rem; }
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #94a3b8; display: inline-block; margin-right: 4px; }
.sync-dot.on { background: #4ade80; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:.4} }

/* FIREBASE BANNER */
.fb-banner { background: #1e293b; color: #f1f5f9; padding: 8px 14px; font-size: 0.75rem; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.fb-banner.ok { background: #14532d; }
.btn-fb { background: #52b788; color: white; border: none; border-radius: 6px; padding: 4px 12px; font-size: 0.72rem; cursor: pointer; font-family: inherit; font-weight: 600; }

/* DAY NAV */
.day-nav { display: flex; gap: 5px; padding: 7px 12px; overflow-x: auto; background: white; border-bottom: 1px solid var(--border); scrollbar-width: none; }
.day-nav::-webkit-scrollbar { display: none; }
.day-btn { flex-shrink: 0; border: 2px solid var(--border); background: white; border-radius: 20px; padding: 4px 12px; font-size: 0.7rem; font-family: inherit; cursor: pointer; color: var(--muted); font-weight: 500; white-space: nowrap; transition: all .2s; }
.day-btn.active { background: var(--primary); border-color: var(--primary); color: white; }

/* NEARBY STRIP */
.nearby-strip { display: flex; gap: 5px; padding: 6px 12px 7px; overflow-x: auto; background: white; border-bottom: 1px solid var(--border); scrollbar-width: none; align-items: center; }
.nearby-strip::-webkit-scrollbar { display: none; }
.nearby-label { font-size: 0.67rem; color: var(--muted); white-space: nowrap; flex-shrink: 0; }
.nearby-btn { flex-shrink: 0; border: 1.5px solid var(--border); background: white; border-radius: 20px; padding: 4px 11px; font-size: 0.7rem; font-family: inherit; cursor: pointer; color: var(--text); white-space: nowrap; }

/* WEATHER BAR */
.weather-bar { background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%); color: white; padding: 6px 14px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; align-items: center; }
.weather-bar::-webkit-scrollbar { display: none; }
.weather-day { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 10px; border-radius: 10px; background: rgba(255,255,255,0.15); min-width: 58px; cursor: pointer; transition: background .2s; }
.weather-day:hover, .weather-day.active { background: rgba(255,255,255,0.3); }
.weather-day .wd-date { font-size: 0.62rem; opacity: 0.85; }
.weather-day .wd-icon { font-size: 1.3rem; }
.weather-day .wd-temp { font-size: 0.68rem; font-weight: 600; }
.weather-day .wd-rain { font-size: 0.6rem; opacity: 0.85; }
.weather-loading { font-size: 0.72rem; opacity: 0.8; padding: 4px 0; }

/* MAIN */
main { padding: 0 0 80px; }

/* DAY SECTION */
.day-section { margin: 12px 12px 0; }
.day-header {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px; border-radius: var(--radius) var(--radius) 0 0;
  color: white; cursor: pointer; user-select: none;
}
.day-header-left { flex: 1; }
.day-header-title { font-size: 0.95rem; font-weight: 700; }
.day-header-sub { font-size: 0.7rem; opacity: 0.85; margin-top: 2px; }
.day-header-weather { font-size: 0.8rem; background: rgba(255,255,255,0.2); border-radius: 8px; padding: 2px 8px; }
.day-toggle { font-size: 0.8rem; opacity: 0.7; transition: transform .2s; }
.day-toggle.open { transform: rotate(180deg); }
.day-body { background: white; border-radius: 0 0 var(--radius) var(--radius); border: 1px solid var(--border); border-top: none; overflow: hidden; }

/* MEAL SECTION */
.meal-section { border-bottom: 1px solid #f3f4f6; }
.meal-section:last-child { border-bottom: none; }
.meal-header { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: #f9fafb; border-bottom: 1px solid #f3f4f6; }
.meal-icon { font-size: 0.95rem; }
.meal-label { font-size: 0.75rem; font-weight: 700; color: var(--muted); flex: 1; }
.meal-add-btn { background: none; border: 1.5px dashed var(--border); border-radius: 8px; padding: 2px 10px; font-size: 0.68rem; color: var(--muted); cursor: pointer; font-family: inherit; }
.meal-cards { min-height: 8px; padding: 4px 8px; }
.meal-cards.drag-over { background: #f0fdf4; border-radius: 8px; }

/* CARD */
.sched-card {
  background: white; border: 1.5px solid var(--border); border-radius: 12px;
  margin: 5px 0; padding: 10px 12px;
  display: flex; align-items: flex-start; gap: 10px;
  cursor: grab; transition: box-shadow .2s, opacity .2s;
  position: relative;
}
.sched-card:active { cursor: grabbing; }
.sched-card.dragging { opacity: 0.4; box-shadow: 0 8px 24px rgba(0,0,0,0.18); }
.sched-card.drag-placeholder { background: #f0fdf4; border: 2px dashed var(--primary-light); opacity: 0.6; }

.card-drag-handle { color: #d1d5db; font-size: 1rem; padding-top: 2px; flex-shrink: 0; touch-action: none; }
.card-cat-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
.card-body { flex: 1; min-width: 0; }
.card-title { font-size: 0.82rem; font-weight: 700; line-height: 1.3; }
.card-time { font-size: 0.68rem; color: var(--muted); margin-top: 2px; cursor: pointer; }
.card-time:hover { color: var(--primary); }
.card-desc { font-size: 0.71rem; color: var(--muted); margin-top: 4px; line-height: 1.5; white-space: pre-line; }
.card-actions { display: flex; gap: 4px; margin-top: 7px; flex-wrap: wrap; }
.card-btn { border: 1.5px solid var(--border); background: white; border-radius: 8px; padding: 3px 9px; font-size: 0.65rem; font-family: inherit; cursor: pointer; color: var(--muted); white-space: nowrap; }
.card-btn.danger { border-color: #fca5a5; color: #dc2626; }
.card-btn.primary { border-color: var(--primary-light); color: var(--primary); }

/* CAT COLORS */
.cat-transport { background: #6366f1; }
.cat-restaurant { background: #f59e0b; }
.cat-attraction { background: #10b981; }
.cat-shopping { background: #8b5cf6; }
.cat-rest { background: #94a3b8; }
.cat-default { background: #d1d5db; }

/* TIME EDITOR */
.time-editor { display: none; margin-top: 5px; }
.time-editor.open { display: flex; gap: 6px; align-items: center; }
.time-editor input { border: 1.5px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: 0.75rem; font-family: inherit; width: 110px; }
.time-editor button { border: none; border-radius: 6px; padding: 4px 10px; font-size: 0.72rem; font-family: inherit; cursor: pointer; }
.time-editor .btn-ok { background: var(--primary); color: white; }
.time-editor .btn-cancel { background: #f3f4f6; color: var(--muted); }

/* EDIT MODAL */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 500; align-items: flex-end; }
.modal-overlay.open { display: flex; }
.modal { background: white; border-radius: 20px 20px 0 0; padding: 20px 16px 30px; width: 100%; max-height: 85vh; overflow-y: auto; }
.modal h3 { font-size: 1rem; font-weight: 700; margin-bottom: 14px; }
.form-row { margin-bottom: 12px; }
.form-row label { font-size: 0.72rem; color: var(--muted); display: block; margin-bottom: 4px; font-weight: 600; }
.form-row input, .form-row textarea, .form-row select {
  width: 100%; border: 1.5px solid var(--border); border-radius: 8px;
  padding: 8px 10px; font-size: 0.82rem; font-family: inherit; outline: none;
}
.form-row textarea { resize: vertical; min-height: 70px; }
.form-actions { display: flex; gap: 8px; margin-top: 14px; }
.btn-primary { flex: 1; background: var(--primary); color: white; border: none; border-radius: 10px; padding: 11px; font-size: 0.85rem; font-family: inherit; cursor: pointer; font-weight: 700; }
.btn-secondary { flex: 1; background: #f3f4f6; color: var(--text); border: none; border-radius: 10px; padding: 11px; font-size: 0.85rem; font-family: inherit; cursor: pointer; }
.btn-danger-full { width: 100%; background: #fee2e2; color: #dc2626; border: none; border-radius: 10px; padding: 11px; font-size: 0.85rem; font-family: inherit; cursor: pointer; margin-top: 8px; font-weight: 700; }

/* FIREBASE SETUP MODAL */
.setup-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 600; align-items: center; justify-content: center; padding: 20px; }
.setup-overlay.open { display: flex; }
.setup-box { background: white; border-radius: 16px; padding: 22px 18px; width: 100%; max-width: 420px; }
.setup-box h3 { font-size: 1rem; font-weight: 700; margin-bottom: 6px; }
.setup-box p { font-size: 0.75rem; color: var(--muted); margin-bottom: 14px; line-height: 1.5; }

/* PARKING PANEL */
.parking-panel { display: none; background: #f8fafc; border-top: 1px solid var(--border); padding: 10px 12px; }
.parking-panel.open { display: block; }
.parking-lot-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid #f1f5f9; font-size: 0.73rem; }
.parking-lot-row:last-child { border-bottom: none; }
.parking-search-btn { display: inline-block; background: #2563eb; color: white; border-radius: 8px; padding: 6px 14px; font-size: 0.75rem; text-decoration: none; font-weight: 600; }

/* TOAST */
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(60px); background: #1e293b; color: white; padding: 10px 20px; border-radius: 24px; font-size: 0.8rem; transition: transform .3s; z-index: 999; white-space: nowrap; }
.toast.show { transform: translateX(-50%) translateY(0); }

/* ADD CARD (empty slot) */
.add-card { border: 1.5px dashed var(--border); border-radius: 12px; margin: 5px 0; padding: 10px 12px; display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--muted); font-size: 0.75rem; }
.add-card:hover { border-color: var(--primary-light); color: var(--primary); background: #f0fdf4; }

/* GAS STATION (day5) */
.gas-section { padding: 10px 12px; background: #fff7ed; border-top: 1px solid #fed7aa; }
.gas-title { font-size: 0.78rem; font-weight: 700; color: #92400e; margin-bottom: 8px; }
.gas-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 0.73rem; border-bottom: 1px solid #fde8c8; }
.gas-row:last-child { border-bottom: none; }
.gas-form { display: none; margin-top: 8px; }
.gas-form.open { display: block; }
.gas-form input { width: 100%; border: 1px solid #fed7aa; border-radius: 6px; padding: 6px 8px; font-size: 0.75rem; margin-bottom: 5px; font-family: inherit; }

/* WEATHER DETAIL */
.weather-detail { display: none; background: #e0f2fe; border-top: 1px solid #bae6fd; padding: 6px 14px; }
.weather-detail.open { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.weather-detail::-webkit-scrollbar { display: none; }
.wh-item { flex-shrink: 0; text-align: center; font-size: 0.65rem; color: #0369a1; }
.wh-item .wh-time { font-weight: 700; }
.wh-item .wh-ic { font-size: 1rem; }
</style>
</head>
<body>

<div class="sticky-top" id="sticky-top">
  <!-- 스크롤 시 접히는 영역 -->
  <div class="collapsible-top" id="collapsible-top">
    <div class="fb-banner" id="fb-banner">
      <span>🔥 Firebase</span>
      <span id="fb-status">⚠️ 미연결 — 로컬 저장만 사용 중</span>
      <button class="btn-fb" onclick="document.getElementById('setup-modal').classList.add('open')" style="margin-left:auto">🔗 공유 설정</button>
    </div>
    <div class="weather-bar" id="weather-bar"><span class="weather-loading">🌤 날씨 불러오는 중...</span></div>
    <div class="weather-detail" id="weather-detail"></div>
  </div>
  <!-- 항상 고정 -->
  <header>
    <h1>✈️ 규슈 가족여행 플래너 🇯🇵</h1>
    <p>성인 2명 + 22개월 아기 · 렌터카 여행</p>
    <div class="header-meta">
      <span class="header-badge">📅 5월 23–27일</span>
      <span class="header-badge">📍 후쿠오카·기타큐슈·벳푸·유후인</span>
      <span class="header-badge">🍼 22개월 동반</span>
      <span class="header-badge"><span class="sync-dot" id="sync-dot"></span><span id="sync-label">오프라인</span></span>
    </div>
  </header>
  <nav class="day-nav" id="day-nav"></nav>
  <div class="nearby-strip">
    <span class="nearby-label">📍 현위치 근처:</span>
    <button class="nearby-btn" onclick="openNearby('cafe')">☕ 카페</button>
    <button class="nearby-btn" onclick="openNearby('uniqlo')">👕 유니클로</button>
    <button class="nearby-btn" onclick="openNearby('convenience')">🏪 편의점</button>
    <button class="nearby-btn" onclick="openNearby('baby')">🍼 유아용품점</button>
  </div>
</div>

<main id="main-content"></main>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h3 id="edit-modal-title">일정 수정</h3>
    <div class="form-row"><label>장소명</label><input id="edit-title" type="text"/></div>
    <div class="form-row"><label>카테고리</label>
      <select id="edit-cat">
        <option value="transport">🚗 이동/교통</option>
        <option value="restaurant">🍴 식사</option>
        <option value="attraction">🏯 관광/체험</option>
        <option value="shopping">🛍 쇼핑</option>
        <option value="rest">🏨 숙소/휴식</option>
      </select>
    </div>
    <div class="form-row"><label>날짜</label>
      <select id="edit-day"></select>
    </div>
    <div class="form-row"><label>섹션</label>
      <select id="edit-meal">
        <option value="breakfast">🌅 조식</option>
        <option value="morning">🌤 오전</option>
        <option value="lunch">🍱 중식</option>
        <option value="afternoon">🌇 오후</option>
        <option value="dinner">🌙 석식</option>
      </select>
    </div>
    <div class="form-row"><label>시간 (선택)</label><input id="edit-time" type="text" placeholder="예: 12:30"/></div>
    <div class="form-row"><label>메모</label><textarea id="edit-desc"></textarea></div>
    <div class="form-row"><label>구글맵 검색어</label><input id="edit-map" type="text"/></div>
    <div class="form-actions">
      <button class="btn-secondary" onclick="closeEditModal()">취소</button>
      <button class="btn-primary" onclick="saveEdit()">저장</button>
    </div>
    <button class="btn-danger-full" onclick="deleteCard()">🗑 이 일정 삭제</button>
  </div>
</div>

<!-- ADD MODAL -->
<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <h3>일정 추가</h3>
    <div class="form-row"><label>장소명</label><input id="add-title" type="text" placeholder="예: 유후인 플로럴 빌리지"/></div>
    <div class="form-row"><label>카테고리</label>
      <select id="add-cat">
        <option value="attraction">🏯 관광/체험</option>
        <option value="restaurant">🍴 식사</option>
        <option value="transport">🚗 이동/교통</option>
        <option value="shopping">🛍 쇼핑</option>
        <option value="rest">🏨 숙소/휴식</option>
      </select>
    </div>
    <div class="form-row"><label>메모</label><textarea id="add-desc" placeholder="메모 (선택)"></textarea></div>
    <div class="form-row"><label>시간 (선택)</label><input id="add-time" type="text" placeholder="예: 14:00"/></div>
    <div class="form-row"><label>구글맵 검색어</label><input id="add-map" type="text" placeholder="예: 유후인역 주차장"/></div>
    <div class="form-actions">
      <button class="btn-secondary" onclick="closeAddModal()">취소</button>
      <button class="btn-primary" onclick="saveAdd()">추가</button>
    </div>
  </div>
</div>

<!-- FIREBASE SETUP MODAL -->
<div class="setup-overlay" id="setup-modal">
  <div class="setup-box">
    <h3>🔥 Firebase 동기화 설정</h3>
    <p>Firebase를 연결하면 두 기기에서 실시간 공유가 됩니다. 사용하지 않아도 로컬 저장은 정상 동작합니다.</p>
    <div class="form-row"><label>API Key</label><input id="fb-apikey" type="text" placeholder="AIza..."/></div>
    <div class="form-row"><label>Auth Domain</label><input id="fb-authdomain" type="text" placeholder="xxx.firebaseapp.com"/></div>
    <div class="form-row"><label>Project ID</label><input id="fb-projectid" type="text" placeholder="your-project-id"/></div>
    <div class="form-row"><label>App ID</label><input id="fb-appid" type="text" placeholder="1:xxx:web:xxx"/></div>
    <div class="form-actions">
      <button class="btn-secondary" onclick="document.getElementById('setup-modal').classList.remove('open')">나중에</button>
      <button class="btn-primary" onclick="saveFirebaseConfig()">연결</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(itinerary));
  showToast("✅ 저장됨");
  if (fbReady && db) {
    db.collection("kyushu2026").doc("shared").set({ itinerary, updatedAt: Date.now() }).catch(()=>{});
  }
}
function load() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) { const p = JSON.parse(s); if (p && p.days) return p; }
  } catch {}
  return freshItinerary();
}

function loadFbCfg() { try { return JSON.parse(localStorage.getItem(FB_CONFIG_KEY)); } catch { return null; } }

async function initFb(cfg) {
  try {
    if (firebase.apps.length === 0) firebase.initializeApp(cfg);
    db = firebase.firestore();
    const ref = db.collection("kyushu2026").doc("shared");
    if (fbUnsub) fbUnsub();
    fbUnsub = ref.onSnapshot(snap => {
      if (snap.exists) {
        const r = snap.data().itinerary;
        if (r && JSON.stringify(r) !== JSON.stringify(itinerary)) { itinerary = r; render(); showToast("🔄 동기화됨"); }
      }
    });
    fbReady = true;
    document.getElementById("fb-banner").classList.add("ok");
    document.getElementById("fb-status").textContent = "✅ 연결됨";
    document.getElementById("sync-dot").classList.add("on");
    document.getElementById("sync-label").textContent = "온라인";
    return true;
  } catch(e) { console.error(e); return false; }
}

window.saveFirebaseConfig = async function() {
  const cfg = {
    apiKey: document.getElementById("fb-apikey").value.trim(),
    authDomain: document.getElementById("fb-authdomain").value.trim(),
    projectId: document.getElementById("fb-projectid").value.trim(),
    appId: document.getElementById("fb-appid").value.trim(),
  };
  if (!cfg.apiKey || !cfg.projectId) { alert("API Key와 Project ID는 필수입니다."); return; }
  localStorage.setItem(FB_CONFIG_KEY, JSON.stringify(cfg));
  const ok = await initFb(cfg);
  if (ok) { document.getElementById("setup-modal").classList.remove("open"); showToast("🔥 Firebase 연결 완료!"); }
  else alert("연결 실패. 설정값을 확인해 주세요.");
};

// ═══════════════════════════════════════════
//  WEATHER (Open-Meteo, 무료 API)
// ═══════════════════════════════════════════
async function loadWeather() {
  // 벳푸 좌표 기준 (규슈 여행 중심지)
  const lat = 33.284, lon = 131.491;
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_sum&hourly=weathercode,temperature_2m,precipitation_probability&timezone=Asia%2FTokyo&forecast_days=7`;
    const res = await fetch(url);
    const d = await res.json();

    const WC = { // weathercode → emoji
      0:"☀️",1:"🌤",2:"⛅",3:"☁️",
      45:"🌫",48:"🌫",51:"🌦",53:"🌦",55:"🌧",
      61:"🌧",63:"🌧",65:"🌧",71:"🌨",73:"🌨",80:"🌦",81:"🌧",82:"⛈",
      95:"⛈",96:"⛈",99:"⛈"
    };
    const getIcon = c => WC[c] || "🌡";
    const isRainy = c => [51,53,55,61,63,65,80,81,82,95,96,99].includes(c);

    const tripDates = ["2026-05-23","2026-05-24","2026-05-25","2026-05-26","2026-05-27"];
    const dayLabels = ["Day1","Day2","Day3","Day4","Day5"];

    // 날씨 데이터 매핑
    weatherData = {};
    tripDates.forEach((date, i) => {
      const idx = d.daily.time.indexOf(date);
      if (idx === -1) return;
      const code = d.daily.weathercode[idx];
      const rain = d.daily.precipitation_sum[idx];
      weatherData[date] = {
        icon: getIcon(code), rainy: isRainy(code),
        max: Math.round(d.daily.temperature_2m_max[idx]),
        min: Math.round(d.daily.temperature_2m_min[idx]),
        rain: rain ? `💧${rain}mm` : "",
        label: dayLabels[i],
        hourly: d.hourly.time.filter(t => t.startsWith(date)).map((t,j) => {
          const hi = d.hourly.time.indexOf(t);
          return {
            time: t.slice(11,16),
            icon: getIcon(d.hourly.weathercode[hi]),
            temp: Math.round(d.hourly.temperature_2m[hi]),
            prob: d.hourly.precipitation_probability[hi],
          };
        })
      };
    });

    // 날씨 바 렌더
    const todayStr = new Date().toISOString().slice(0,10);
    const pastMessages = ["✨완료","🎉추억","🌟끝","💫다녀옴","🗓기록"];
    const bar = document.getElementById("weather-bar");
    const dateShorts = ["5/23","5/24","5/25","5/26","5/27"];
    bar.innerHTML = tripDates.map((date, i) => {
      const isPast = date < todayStr;
      const w = weatherData[date];
      if (!w) {
        const pastMsg = isPast ? pastMessages[i] : "❓";
        const pastClass = isPast ? "past" : "";
        return `<div class="weather-day ${pastClass}" id="wday-${date}">
          <div class="wd-date">${dayLabels[i]}</div>
          <div class="wd-date">${dateShorts[i]}</div>
          <div class="wd-icon" style="font-size:0.75rem">${pastMsg}</div>
        </div>`;
      }
      if (isPast) {
        return `<div class="weather-day past" id="wday-${date}">
          <div class="wd-date">${dayLabels[i]}</div>
          <div class="wd-date">${dateShorts[i]}</div>
          <div class="wd-icon" style="font-size:0.75rem">${pastMessages[i]}</div>
          <div class="wd-rain" style="font-size:0.58rem;opacity:0.7">${w.icon} ${w.max}°/${w.min}°</div>
        </div>`;
      }
      const rainAlert = w.rainy ? `<div class="wd-rain" style="color:#fde68a">⚠️ 우천</div>` : `<div class="wd-rain">${w.rain || "맑음"}</div>`;
      return `<div class="weather-day" onclick="toggleWeatherDetail('${date}')" id="wday-${date}">
        <div class="wd-date">${dayLabels[i]}</div>
        <div class="wd-date" style="font-size:0.6rem">${dateShorts[i]}</div>
        <div class="wd-icon">${w.icon}</div>
        <div class="wd-temp">${w.min}°~${w.max}°</div>
        ${rainAlert}
      </div>`;
    }).join("");

    render(); // 날씨 받은 후 헤더에 반영
  } catch(e) {
    document.getElementById("weather-bar").innerHTML = `<span class="weather-loading">날씨 정보를 불러오지 못했습니다.</span>`;
  }
}

function toggleWeatherDetail(date) {
  const det = document.getElementById("weather-detail");
  const btn = document.getElementById("wday-" + date);
  document.querySelectorAll(".weather-day").forEach(el => el.classList.remove("active"));
  if (activeWeatherDay === date) {
    det.classList.remove("open");
    det.innerHTML = "";
    activeWeatherDay = null;
    return;
  }
  activeWeatherDay = date;
  btn.classList.add("active");
  const w = weatherData[date];
  if (!w) return;
  // 6시간 단위만 표시
  const hours = w.hourly.filter((_,i) => i % 2 === 0);
  det.innerHTML = hours.map(h => `
    <div class="wh-item">
      <div class="wh-time">${h.time}</div>
      <div class="wh-ic">${h.icon}</div>
      <div>${h.temp}°</div>
      <div>${h.prob}%</div>
    </div>`).join("");
  det.classList.add("open");
}

function findDay(dayId) { return itinerary.days.find(d => d.id === dayId); }
function findCard(dayId, sectionId, cardId) {
  const day = findDay(dayId);
  if (!day) return null;
  const sec = day.sections[sectionId];
  if (!sec) return null;
  return sec.find(c => c.id === cardId);
}
function mapsUrl(q) {
  if (!q) return null;
  return `https://www.google.com/maps/search/${encodeURIComponent(q)}`;
}
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

function openNearby(cat) {
  const cfg = NEARBY_CONFIG[cat];
  const kw = cfg.keyword;
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => window.open(`https://www.google.com/maps/search/${encodeURIComponent(kw)}/@${pos.coords.latitude},${pos.coords.longitude},15z`, "_blank"),
      ()   => window.open(`https://www.google.com/maps/search/${encodeURIComponent(kw + " 九州")}`, "_blank"),
      { timeout: 5000 }
    );
  } else {
    window.open(`https://www.google.com/maps/search/${encodeURIComponent(kw + " 九州")}`, "_blank");
  }
}

//  RENDER
// ═══════════════════════════════════════════
function render() {
  renderDayNav();
  renderDays();
}

function renderDayNav() {
  const nav = document.getElementById("day-nav");
  nav.innerHTML = itinerary.days.map(d => {
    const w = weatherData[d.date ? dateKeyFromLabel(d.date) : null];
    const wi = w ? w.icon : "";
    return `<button class="day-btn" onclick="scrollToDay('${d.id}')">${d.label} ${wi} ${d.date || ""}</button>`;
  }).join("");
}

function dateKeyFromLabel(label) {
  // "5월 23일 (토)" → "2026-05-23"
  const m = label.match(/(\d+)월\s*(\d+)일/);
  if (!m) return null;
  return `2026-${String(m[1]).padStart(2,"0")}-${String(m[2]).padStart(2,"0")}`;
}

function renderDays() {
  const main = document.getElementById("main-content");
  main.innerHTML = itinerary.days.map(day => renderDay(day)).join("");
}

function renderDay(day) {
  const dateKey = dateKeyFromLabel(day.date);
  const w = weatherData[dateKey];
  const rainBadge = w && w.rainy ? `<span class="day-header-weather">⛈ 우천주의</span>` : (w ? `<span class="day-header-weather">${w.icon} ${w.max}°/${w.min}°</span>` : "");

  const sectionsHtml = MEAL_SECTIONS.map(ms => {
    const cards = (day.sections[ms.id] || []);
    const cardsHtml = cards.map(c => renderCard(day.id, ms.id, c)).join("");
    return `<div class="meal-section" id="ms-${day.id}-${ms.id}">
      <div class="meal-header">
        <span class="meal-icon">${ms.icon}</span>
        <span class="meal-label">${ms.label}</span>
        <button class="meal-add-inline" onclick="openAddModal('${day.id}','${ms.id}')">＋ 추가</button>
      </div>
      <div class="meal-cards" id="mc-${day.id}-${ms.id}"
        ondragover="onDragOver(event,'${day.id}','${ms.id}')"
        ondrop="onDrop(event,'${day.id}','${ms.id}')"
        ondragleave="onDragLeave(event)">
        ${cardsHtml}
      </div>
    </div>`;
  }).join("");

  // gas section removed - now handled as cards in morning section

  return `<div class="day-section" id="${day.id}">
    <div class="day-header" style="background:${day.color}">
      <div class="day-header-left">
        <div class="day-header-title">${day.label} · ${day.theme}</div>
        <div class="day-header-sub">${day.date}</div>
      </div>
      ${rainBadge}
    </div>
    <div class="day-body">
      ${sectionsHtml}
    </div>
  </div>`;
}

function renderCard(dayId, sectionId, card) {
  // 주유 카드 특수 렌더
  if (card.isGasCard) {
    const savedName = card.gasName || "";
    const mq = savedName ? savedName + " ガソリンスタンド" : "";
    const mapBtnHtml = mq
      ? `<a href="https://www.google.com/maps/search/${encodeURIComponent(mq)}" target="_blank" class="card-btn primary" style="text-decoration:none">📍 지도</a>`
      : "";
    return `<div class="sched-card" id="card-${card.id}" style="background:#fff7ed;border-color:#fed7aa;">
      <div style="font-size:1.3rem;flex-shrink:0">⛽</div>
      <div class="card-body">
        <div class="card-title" style="color:#92400e">주유소</div>
        <div style="display:flex;gap:6px;margin-top:6px;align-items:center">
          <input id="gas-name-${card.id}" type="text" value="${savedName}"
            placeholder="주유소 이름 입력 후 지도 검색"
            style="flex:1;border:1.5px solid #fed7aa;border-radius:8px;padding:5px 8px;font-size:0.75rem;font-family:inherit;"
            oninput="updateGasCard('${dayId}','${sectionId}','${card.id}',this.value)"/>
          ${mapBtnHtml}
        </div>
        <div style="font-size:0.65rem;color:#b45309;margin-top:4px">반납 전 주유 필수 · 이름 입력 후 📍 지도 버튼</div>
      </div>
    </div>`;
  }
  const color = CAT_COLORS[card.cat] || "#d1d5db";
  const timeHtml = card.time
    ? `<div class="card-time" onclick="toggleTimeEdit('${card.id}')">🕐 ${card.time} <span style="font-size:0.6rem;color:#bbb">(탭해서 수정)</span></div>`
    : `<div class="card-time" onclick="toggleTimeEdit('${card.id}')">⏱ 시간 미입력 <span style="font-size:0.6rem;color:#bbb">(탭해서 추가)</span></div>`;
  const mapBtn = card.mapQuery
    ? `<button class="card-btn primary" onclick="window.open('${mapsUrl(card.mapQuery)}','_blank')">📍 지도</button>`
    : "";
  const parkBtn = PARKING_DATA[card.mapQuery]
    ? `<button class="card-btn" onclick="toggleParking('${card.id}')">🅿️ 주차</button>`
    : "";
  const recommendBtn = `<button class="card-btn" onclick="openRecommend('${dayId}','${sectionId}','${card.id}')">🔍 주변추천</button>`;

  return `<div class="sched-card" id="card-${card.id}"
    draggable="true"
    ondragstart="onDragStart(event,'${dayId}','${sectionId}','${card.id}')"
    ondragend="onDragEnd(event)"
    ontouchstart="onTouchStart(event,'${dayId}','${sectionId}','${card.id}')"
    ontouchmove="onTouchMove(event)"
    ontouchend="onTouchEnd(event,'${dayId}','${sectionId}')">
    <div class="card-drag-handle">⠿</div>
    <div class="card-cat-dot" style="background:${color}"></div>
    <div class="card-body">
      <div class="card-title">${card.title}</div>
      ${timeHtml}
      <div class="time-editor" id="te-${card.id}">
        <input type="text" id="ti-${card.id}" value="${card.time||""}" placeholder="HH:MM" style="width:90px"/>
        <button class="btn-ok" onclick="saveTime('${dayId}','${sectionId}','${card.id}')">확인</button>
        <button class="btn-cancel" onclick="toggleTimeEdit('${card.id}')">✕</button>
      </div>
      ${card.desc ? `<div class="card-desc">${card.desc}</div>` : ""}
      <div class="card-actions">
        ${mapBtn}${parkBtn}${recommendBtn}
        <button class="card-btn" onclick="openEditModal('${dayId}','${sectionId}','${card.id}')">✏️ 수정</button>
      </div>
      <div class="parking-panel" id="pp-${card.id}">${renderParking(card.mapQuery)}</div>
    </div>
  </div>`;
}

function renderParking(mapQuery) {
  const data = PARKING_DATA[mapQuery];
  if (!data) return "";
  return data.lots.map(l => `<div class="parking-lot-row">
    <div style="flex:1"><div style="font-weight:600">${l.name}</div><div style="color:var(--muted)">${l.dist} · ${l.fee}</div></div>
    <a class="parking-search-btn" href="${l.url}" target="_blank" style="font-size:0.68rem;padding:4px 9px">지도</a>
  </div>`).join("");
}

// ═══════════════════════════════════════════
//  DRAG & DROP (Desktop)
// ═══════════════════════════════════════════
let dragState = null;

function onDragStart(e, dayId, sectionId, cardId) {
  dragState = { dayId, sectionId, cardId };
  e.dataTransfer.effectAllowed = "move";
  document.body.classList.add("dragging-active");
  setTimeout(() => document.getElementById("card-" + cardId)?.classList.add("dragging"), 0);
}
function onDragEnd(e) {
  document.body.classList.remove("dragging-active");
  document.querySelectorAll(".dragging").forEach(el => el.classList.remove("dragging"));
  document.querySelectorAll(".drag-over").forEach(el => el.classList.remove("drag-over"));
}
function onDragOver(e, dayId, sectionId) {
  e.preventDefault();
  document.querySelectorAll(".drag-over").forEach(el => el.classList.remove("drag-over"));
  document.getElementById(`mc-${dayId}-${sectionId}`)?.classList.add("drag-over");
}
function onDragLeave(e) {
  e.currentTarget.classList.remove("drag-over");
}
function onDrop(e, toDayId, toSectionId) {
  e.preventDefault();
  if (!dragState) return;
  const { dayId: fromDayId, sectionId: fromSectionId, cardId } = dragState;
  moveCard(fromDayId, fromSectionId, cardId, toDayId, toSectionId);
  dragState = null;
}

// ═══════════════════════════════════════════
//  TOUCH DRAG (Mobile)
// ═══════════════════════════════════════════
let touchDrag = null;
let touchClone = null;

function onTouchStart(e, dayId, sectionId, cardId) {
  if (e.target.closest("button, a, input")) return;
  const touch = e.touches[0];
  const card = document.getElementById("card-" + cardId);
  const rect = card.getBoundingClientRect();
  touchDrag = { dayId, sectionId, cardId, startX: touch.clientX, startY: touch.clientY, moved: false };

  // 롱프레스 후 드래그 시작
  touchDrag.timer = setTimeout(() => {
    touchDrag.active = true;
    document.body.classList.add("dragging-active");
    touchClone = card.cloneNode(true);
    touchClone.style.cssText = `position:fixed;left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;opacity:0.85;z-index:999;pointer-events:none;transform:scale(1.03);box-shadow:0 12px 32px rgba(0,0,0,0.25);`;
    document.body.appendChild(touchClone);
    card.style.opacity = "0.3";
    navigator.vibrate && navigator.vibrate(40);
  }, 350);
}

function onTouchMove(e) {
  if (!touchDrag) return;
  const touch = e.touches[0];
  const dx = touch.clientX - touchDrag.startX;
  const dy = touch.clientY - touchDrag.startY;
  if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
    clearTimeout(touchDrag.timer);
    touchDrag.moved = true;
  }
  if (!touchDrag.active || !touchClone) return;
  e.preventDefault();
  touchClone.style.left = (touch.clientX - touchClone.offsetWidth / 2) + "px";
  touchClone.style.top  = (touch.clientY - touchClone.offsetHeight / 2) + "px";

  // 드롭 대상 하이라이트
  document.querySelectorAll(".drag-over").forEach(el => el.classList.remove("drag-over"));
  touchClone.style.display = "none";
  const under = document.elementFromPoint(touch.clientX, touch.clientY);
  touchClone.style.display = "";
  const mc = under?.closest("[id^='mc-']");
  if (mc) mc.classList.add("drag-over");
}

function onTouchEnd(e) {
  if (!touchDrag) return;
  clearTimeout(touchDrag.timer);

  if (touchDrag.active && touchClone) {
    const touch = e.changedTouches[0];
    touchClone.style.display = "none";
    const under = document.elementFromPoint(touch.clientX, touch.clientY);
    touchClone.style.display = "";
    const mc = under?.closest("[id^='mc-']");
    document.getElementById("card-" + touchDrag.cardId).style.opacity = "";

    if (mc) {
      const [, toDayId, toSectionId] = mc.id.split("-").reduce((acc, v, i, arr) => {
        // mc-day1-breakfast → ["mc","day1","breakfast"]
        return acc;
      }, []) || [];
      // parse from id: mc-{dayId}-{sectionId}
      // mc-day1-breakfast  →  parts[1]=day1  parts[2]=breakfast
      const raw = mc.id.slice(3); // remove "mc-"
      const dashIdx = raw.indexOf("-");
      if (dashIdx !== -1) {
        const toDayId    = raw.slice(0, dashIdx);
        const toSectionId = raw.slice(dashIdx + 1);
        moveCard(touchDrag.dayId, touchDrag.sectionId, touchDrag.cardId, toDayId, toSectionId);
      }
    }
    touchClone.remove();
    touchClone = null;
    document.body.classList.remove("dragging-active");
    document.querySelectorAll(".drag-over").forEach(el => el.classList.remove("drag-over"));
  }
  touchDrag = null;
}

// ═══════════════════════════════════════════
//  MOVE CARD
// ═══════════════════════════════════════════
function moveCard(fromDayId, fromSectionId, cardId, toDayId, toSectionId) {
  if (fromDayId === toDayId && fromSectionId === toSectionId) return;
  const fromDay = findDay(fromDayId);
  const toDay   = findDay(toDayId);
  if (!fromDay || !toDay) return;
  const fromSec = fromDay.sections[fromSectionId];
  const toSec   = toDay.sections[toSectionId];
  if (!fromSec || toSec === undefined) return;
  const idx = fromSec.findIndex(c => c.id === cardId);
  if (idx === -1) return;
  const [card] = fromSec.splice(idx, 1);
  toSec.push(card);
  updateDayTheme(fromDayId);
  updateDayTheme(toDayId);
  save(); render();
  showToast(`📦 ${card.title} 이동 완료`);
}

function updateDayTheme(dayId) {
  const day = findDay(dayId);
  if (!day) return;
  // 전체 카드 중 attraction/restaurant 위주로 주요 장소 추출
  const allCards = Object.values(day.sections).flat();
  const highlights = allCards
    .filter(c => c.cat === "attraction" || c.cat === "restaurant")
    .slice(0, 2)
    .map(c => c.title.length > 8 ? c.title.slice(0,8)+"…" : c.title);
  if (highlights.length > 0) day.theme = highlights.join(" · ");
}

// ═══════════════════════════════════════════
//  TIME EDIT (inline)
// ═══════════════════════════════════════════
function toggleTimeEdit(cardId) {
  const te = document.getElementById("te-" + cardId);
  if (te) te.classList.toggle("open");
}
function saveTime(dayId, sectionId, cardId) {
  const val = document.getElementById("ti-" + cardId)?.value.trim();
  const card = findCard(dayId, sectionId, cardId);
  if (card) { card.time = val; save(); render(); }
}

// ═══════════════════════════════════════════
//  PARKING TOGGLE
// ═══════════════════════════════════════════
function toggleParking(cardId) {
  document.getElementById("pp-" + cardId)?.classList.toggle("open");
}

// ═══════════════════════════════════════════
//  RECOMMEND (구글맵 외부 연결)
// ═══════════════════════════════════════════
function openRecommend(dayId, sectionId, cardId) {
  const card = findCard(dayId, sectionId, cardId);
  if (!card) return;
  const loc = card.mapQuery || card.title;
  const catMap = {
    restaurant: "子連れ ランチ おすすめ",
    attraction:  "観光スポット 子供向け",
    shopping:    "ショッピング",
  };
  const kw = `${loc} 近く ${catMap[card.cat] || "おすすめ"}`;
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => window.open(`https://www.google.com/maps/search/${encodeURIComponent(kw)}/@${pos.coords.latitude},${pos.coords.longitude},15z`, "_blank"),
      ()  => window.open(`https://www.google.com/maps/search/${encodeURIComponent(kw)}`, "_blank"),
      { timeout: 4000 }
    );
  } else {
    window.open(`https://www.google.com/maps/search/${encodeURIComponent(kw)}`, "_blank");
  }
}

// ═══════════════════════════════════════════
//  EDIT MODAL
// ═══════════════════════════════════════════
function openEditModal(dayId, sectionId, cardId) {
  const card = findCard(dayId, sectionId, cardId);
  if (!card) return;
  editTarget = { dayId, sectionId, cardId };
  document.getElementById("edit-title").value = card.title;
  document.getElementById("edit-cat").value   = card.cat;
  document.getElementById("edit-time").value  = card.time || "";
  document.getElementById("edit-desc").value  = card.desc || "";
  document.getElementById("edit-map").value   = card.mapQuery || "";
  // day selector
  const dayEl = document.getElementById("edit-day");
  dayEl.innerHTML = itinerary.days.map(d => `<option value="${d.id}" ${d.id===dayId?"selected":""}>${d.label} ${d.date}</option>`).join("");
  // section selector
  const mealEl = document.getElementById("edit-meal");
  mealEl.value = sectionId;
  document.getElementById("edit-modal").classList.add("open");
}
function closeEditModal() { document.getElementById("edit-modal").classList.remove("open"); editTarget = null; }
function saveEdit() {
  if (!editTarget) return;
  const { dayId, sectionId, cardId } = editTarget;
  const card = findCard(dayId, sectionId, cardId);
  if (!card) return;
  card.title    = document.getElementById("edit-title").value.trim() || card.title;
  card.cat      = document.getElementById("edit-cat").value;
  card.time     = document.getElementById("edit-time").value.trim();
  card.desc     = document.getElementById("edit-desc").value.trim();
  card.mapQuery = document.getElementById("edit-map").value.trim();

  const newDayId  = document.getElementById("edit-day").value;
  const newSecId  = document.getElementById("edit-meal").value;
  if (newDayId !== dayId || newSecId !== sectionId) {
    moveCard(dayId, sectionId, cardId, newDayId, newSecId);
  } else {
    save(); render();
  }
  closeEditModal();
}
function deleteCard() {
  if (!editTarget) return;
  const { dayId, sectionId, cardId } = editTarget;
  const day = findDay(dayId);
  if (!day) return;
  const sec = day.sections[sectionId];
  const idx = sec.findIndex(c => c.id === cardId);
  if (idx !== -1) { sec.splice(idx, 1); save(); render(); }
  closeEditModal();
}

// ═══════════════════════════════════════════
//  ADD MODAL
// ═══════════════════════════════════════════
function openAddModal(dayId, sectionId) {
  addTarget = { dayId, sectionId };
  document.getElementById("add-title").value = "";
  document.getElementById("add-desc").value  = "";
  document.getElementById("add-time").value  = "";
  document.getElementById("add-map").value   = "";
  document.getElementById("add-cat").value   = "attraction";
  document.getElementById("add-modal").classList.add("open");
}
function closeAddModal() { document.getElementById("add-modal").classList.remove("open"); addTarget = null; }
function saveAdd() {
  if (!addTarget) return;
  const title = document.getElementById("add-title").value.trim();
  if (!title) { alert("장소명을 입력해 주세요."); return; }
  const day = findDay(addTarget.dayId);
  if (!day) return;
  day.sections[addTarget.sectionId].push({
    id: newId(),
    title,
    cat:      document.getElementById("add-cat").value,
    time:     document.getElementById("add-time").value.trim(),
    desc:     document.getElementById("add-desc").value.trim(),
    mapQuery: document.getElementById("add-map").value.trim(),
  });
  save(); render(); closeAddModal();
}

// ═══════════════════════════════════════════
//  GAS CARD UPDATE
// ═══════════════════════════════════════════
function updateGasCard(dayId, sectionId, cardId, name) {
  const card = findCard(dayId, sectionId, cardId);
  if (!card) return;
  card.gasName = name;
  // 지도 버튼 동적 업데이트 (re-render 없이)
  const mq = name ? name + " ガソリンスタンド" : "";
  const cardEl = document.getElementById("card-" + cardId);
  if (!cardEl) return;
  let mapBtn = cardEl.querySelector(".card-btn.primary");
  if (mq) {
    if (!mapBtn) {
      mapBtn = document.createElement("a");
      mapBtn.className = "card-btn primary";
      mapBtn.target = "_blank";
      mapBtn.style.textDecoration = "none";
      mapBtn.textContent = "📍 지도";
      const inputEl = cardEl.querySelector("input");
      inputEl?.parentElement?.appendChild(mapBtn);
    }
    mapBtn.href = `https://www.google.com/maps/search/${encodeURIComponent(mq)}`;
  } else if (mapBtn) {
    mapBtn.remove();
  }
  // 조용히 저장 (toast 없이)
  localStorage.setItem(STORAGE_KEY, JSON.stringify(itinerary));
}

// ═══════════════════════════════════════════
//  SCROLL
// ═══════════════════════════════════════════
function scrollToDay(dayId) {
  document.getElementById(dayId)?.scrollIntoView({ behavior: "smooth", block: "start" });
}

// ═══════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════
itinerary = load();
render();
loadWeather();

const savedCfg = loadFbCfg();
if (savedCfg && savedCfg.apiKey) initFb(savedCfg);

// ─── 스크롤 감지: Firebase+날씨 접기 ───
let lastScrollY = 0;
let scrollTimer = null;
const COLLAPSE_THRESHOLD = 60;
window.addEventListener("scroll", () => {
  const sy = window.scrollY;
  const collapsible = document.getElementById("collapsible-top");
  const sticky = document.getElementById("sticky-top");
  if (sy > COLLAPSE_THRESHOLD) {
    collapsible.classList.add("collapsed");
    sticky.classList.add("scrolled");
  } else {
    collapsible.classList.remove("collapsed");
    sticky.classList.remove("scrolled");
  }
  lastScrollY = sy;
}, { passive: true });
</script>
